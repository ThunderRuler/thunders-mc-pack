# mcopt settings. Written on first launch; edit freely.
#
# The indie profile: mcopt's own terrain renderer on Apple Metal (no Sodium), plus measured startup and
# thread-priority options. To turn all of it off (vanilla's renderer), change the next line to:  profile=none
profile=indie
#
# Single switches win over the profile, e.g. our renderer off but the rest on:
#mcopt.own=false
#
# Metal Shaders (mcopt-shade): lighting, shadows, sky, clouds, water, god rays. false = mcopt's plain Metal renderer.
mcopt.shade=true
# Quality preset: performance, balanced, quality or ultra.
mcopt.shade.preset=performance
# Art style: epic, storybook or natural.
mcopt.shade.look=epic
#
# Far terrain (EXPERIMENTAL, off by default; for Macs with 10 or more GPU cores): remove the # below.
#mcopt.lod=true
# Resolución del mundo (también desde el menú de pausa): auto, native, 1800, 1600, 1440, 1200, 1080
# MacBook Air M2: native measured as fast as 1080 (no upscale pass), so use native.
mcopt.shade.resolution=1080
# Photon-ish tint (light touch, user decision 2026-10-15: nudge toward Photon, not 1:1)
mcopt.shade.user.temperature=8
mcopt.shade.user.sunColor=106
mcopt.shade.user.contrast=105
mcopt.shade.user.sunset=130
mcopt.shade.user.eveningGlow=130
mcopt.shade.user.purkinje=130
mcopt.shade.user.cloudCoverage=20
mcopt.shade.user.cloudBrightness=95
# SDR output like Photon (XDR highlights off)
mcopt.shade.xdr=off
